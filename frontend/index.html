<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FACC15" />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://api.don-va.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

    <!-- Canonical & hreflang -->
    <link rel="canonical" href="https://don-va.com/" />
    <link rel="alternate" hreflang="en" href="https://don-va.com/" />
    <link rel="alternate" hreflang="de" href="https://don-va.com/de/" />
    <link rel="alternate" hreflang="x-default" href="https://don-va.com/" />

    <!-- Crawl directives -->
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="google-site-verification" content="iBr-clJQ_5h4eH3I4mYvW40QwrBQ-uoKtNkx9ZiWWts" />

    <!-- Primary SEO -->
    <title>Donva | Virtual Assistant Services for Business Growth</title>
    <meta name="description" content="Hire pre-vetted virtual assistants for admin support, customer service, social media & SEO. Donva helps businesses scale with expert VAs — serving DE, AT, CH & US." />
    <meta name="keywords" content="virtual assistant, VA services, administrative support, customer support, social media management, SEO content, remote assistant, business productivity, Donva" />
    <meta name="author" content="Donva" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Donva" />
    <meta property="og:title" content="Donva | Virtual Assistant Services for Business Growth" />
    <meta property="og:description" content="Hire pre-vetted virtual assistants for admin support, customer service, social media & SEO. Expert VAs serving DE, AT, CH & US businesses." />
    <meta property="og:url" content="https://don-va.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:image" content="https://don-va.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Donva — Virtual Assistant Services" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Donva | Virtual Assistant Services for Business Growth" />
    <meta name="twitter:description" content="Hire pre-vetted virtual assistants for admin support, customer service, social media & SEO. Expert VAs serving DE, AT, CH & US businesses." />
    <meta name="twitter:image" content="https://don-va.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Donva — Virtual Assistant Services" />

    <!-- Structured Data: ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Donva",
      "url": "https://don-va.com/",
      "logo": "https://don-va.com/favicon.svg",
      "description": "Pre-vetted virtual assistant services for admin support, customer service, social media management, and SEO & content.",
      "serviceType": ["Virtual Assistant Services", "Administrative Support", "Customer Support", "Social Media Management", "SEO & Content"],
      "areaServed": [
        {"@type": "Country", "name": "Germany"},
        {"@type": "Country", "name": "Austria"},
        {"@type": "Country", "name": "Switzerland"},
        {"@type": "Country", "name": "United States"}
      ],
      "knowsLanguage": ["en", "de"],
      "priceRange": "€€",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "German"],
        "url": "https://don-va.com/contact"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Donva",
      "url": "https://don-va.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://don-va.com/?s={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
