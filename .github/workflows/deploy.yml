name: Deploy Backend to VPS

on:
  push:
    branches:
      - mubii
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e  # Exit immediately if a command exits with a non-zero status
            echo "🚀 Starting deployment..."

            # Define paths
            REPO_DIR="/var/www/vaa-backend"
            BACKEND_DIR="$REPO_DIR/backend"
            ENV_FILE="$BACKEND_DIR/.env"
            TEMP_ENV_BACKUP="/tmp/vaa-backend.env.backup"

            # Navigate to application directory
            echo "📂 Navigating to repository..."
            cd $REPO_DIR

            # Backup .env safely to /tmp
            if [ -f "$ENV_FILE" ]; then
              echo "💾 Backing up .env to safe location..."
              cp "$ENV_FILE" "$TEMP_ENV_BACKUP"
            else
              echo "⚠️ No .env file found at $ENV_FILE. Skipping backup."
            fi

            # Fetch and Reset
            echo "📥 Fetching and resetting repository..."
            # Fetch the specific branch
            git fetch origin mubii
            # Reset hard to matches the remote state exactly
            # This DISCARDS local changes and ignores merge conflicts by overwriting
            git reset --hard origin/mubii

            # Restore .env
            if [ -f "$TEMP_ENV_BACKUP" ]; then
              echo "♻️ Restoring .env..."
              mv "$TEMP_ENV_BACKUP" "$ENV_FILE"
            else
               echo "⚠️ No backup found to restore."
            fi

            # Navigate to backend for install/restart
            cd $BACKEND_DIR

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production

            # Restart application with PM2
            echo "🔄 Restarting application..."
            pm2 restart vaa-backend || pm2 start ecosystem.config.cjs

            # Save PM2 configuration
            pm2 save

            # Wait for application to start
            echo "⏳ Waiting for application to start..."
            sleep 5

            # Health check
            echo "🏥 Running health check..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/health || echo "000")

            if [ "$HEALTH_STATUS" -eq 200 ]; then
              echo "✅ Deployment successful! Application is healthy."
              pm2 list
            else
              echo "❌ Deployment failed! Health check returned status: $HEALTH_STATUS"
              pm2 logs vaa-backend --lines 50
              exit 1
            fi

      - name: Deployment Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment failed"
          fi
