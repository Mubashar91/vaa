server {
    listen 80;
    listen [::]:80;
    
    # VPS IP address (update with domain when available)
    server_name 147.93.72.136;
    
    # Increase client body size for file uploads
    client_max_body_size 10M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    
    # Proxy to Node.js application
    location / {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint (optional: can be accessed directly)
    location /health {
        proxy_pass http://localhost:5001/health;
        access_log off;
    }
    
    # Access and error logs
    access_log /var/log/nginx/vaa-backend-access.log;
    error_log /var/log/nginx/vaa-backend-error.log;
}

