<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing Admin</title>
  <style>  
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 24px;
    }

    header {             
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    input,
    select,
    button,
    textarea {
      padding: 8px;
      font-size: 14px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 16px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f6f6f6;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .muted {
      color: #666
    }

    details {
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h2>Pricing Admin</h2>
    <label>Language
      <select id="lang">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
    <label class="row">Token <input id="token" placeholder="ADMIN_TOKEN" /></label>
    <button id="load">Load</button>
    <span class="muted">Bearer token from backend .env</span>
  </header>

  <section>
    <h3>Plans</h3>
    <table>
      <thead>
        <tr>
          <th>planKey</th>
          <th>name</th>
          <th>hours</th>
          <th>price</th>
          <th>setupFee</th>
          <th>badge</th>
          <th>features (newline separated)</th>
          <th>highlighted</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <details>
      <summary>Add New Plan</summary>
      <div class="row">
        <input id="new_planKey" placeholder="planKey (e.g. starter)" />
        <input id="new_name" placeholder="name" />
        <input id="new_hours" placeholder="hours e.g. 10h / week" />
        <input id="new_price" type="number" placeholder="price" min="0" step="0.01" />
        <input id="new_setupFee" type="number" placeholder="setupFee" min="0" step="0.01" />
        <input id="new_badge" placeholder="badge (optional)" />
        <label>highlighted <input id="new_highlighted" type="checkbox" /></label>
      </div>
      <div>
        <textarea id="new_features" rows="4" style="width:100%" placeholder="features, one per line"></textarea>
      </div>
      <button id="add">Add</button>
    </details>
  </section>

  <script>
    const base = location.origin;

    function authHeader() {
      const token = document.getElementById('token').value.trim();
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    function featureListToText(list) { return (list || []).join('\n'); }
    function textToFeatureList(text) { return text.split('\n').map(s => s.trim()).filter(Boolean); }

    async function load() {
      const lang = document.getElementById('lang').value;
      const res = await fetch(`${base}/api/admin/pricing?lang=${lang}`, { headers: authHeader() });
      if (!res.ok) { alert('Failed: ' + res.status); return; }
      const data = await res.json();
      render(data.plans || []);
    }

    function render(plans) {
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      for (const p of plans) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.planKey}</td>
          <td contenteditable data-key="name">${p.name || ''}</td>
          <td contenteditable data-key="hours">${p.hours || ''}</td>
          <td contenteditable data-key="price">${p.price || 0}</td>
          <td contenteditable data-key="setupFee">${p.setupFee || 0}</td>
          <td contenteditable data-key="badge">${p.badge || ''}</td>
          <td contenteditable data-key="features">${featureListToText(p.features)}</td>
          <td><input type="checkbox" data-key="highlighted" ${p.highlighted ? 'checked' : ''}></td>
          <td>
            <button data-action="save">Save</button>
            <button data-action="delete">Delete</button>
          </td>
        `;
        tr.querySelector('[data-action="save"]').onclick = () => saveRow(p.planKey, tr);
        tr.querySelector('[data-action="delete"]').onclick = () => delRow(p.planKey);
        tbody.appendChild(tr);
      }
    }

    async function saveRow(planKey, tr) {
      const lang = document.getElementById('lang').value;
      const updates = {};
      tr.querySelectorAll('[contenteditable]').forEach(cell => {
        const key = cell.dataset.key;
        let val = cell.innerText.trim();
        if (key === 'price' || key === 'setupFee') val = Number(val);
        if (key === 'features') val = textToFeatureList(val);
        updates[key] = val;
      });
      updates.highlighted = tr.querySelector('input[data-key="highlighted"]').checked;
      if (typeof updates.price === 'number' && (isNaN(updates.price) || updates.price < 0)) { alert('Price must be a non-negative number'); return; }
      if (typeof updates.setupFee === 'number' && (isNaN(updates.setupFee) || updates.setupFee < 0)) { alert('Setup fee must be a non-negative number'); return; }
      const res = await fetch(`${base}/api/admin/pricing/${planKey}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', ...authHeader() },
        body: JSON.stringify({ lang, updates })
      });
      if (!res.ok) { alert('Save failed: ' + res.status); return; }
      await load();
    }

    async function delRow(planKey) {
      const lang = document.getElementById('lang').value;
      if (!confirm('Delete ' + planKey + '?')) return;
      const res = await fetch(`${base}/api/admin/pricing/${planKey}?lang=${lang}`, {
        method: 'DELETE',
        headers: authHeader()
      });
      if (!res.ok) { alert('Delete failed: ' + res.status); return; }
      await load();
    }

    async function add() {
      const lang = document.getElementById('lang').value;
      const plan = {
        planKey: document.getElementById('new_planKey').value.trim(),
        name: document.getElementById('new_name').value.trim(),
        hours: document.getElementById('new_hours').value.trim(),
        price: Number(document.getElementById('new_price').value || 0),
        setupFee: Number(document.getElementById('new_setupFee').value || 0),
        badge: document.getElementById('new_badge').value.trim() || undefined,
        features: textToFeatureList(document.getElementById('new_features').value),
        highlighted: document.getElementById('new_highlighted').checked
      };
      if (!plan.planKey) { alert('planKey required'); return; }
      const allowed = ['starter', 'professional', 'enterprise'];
      if (!allowed.includes(plan.planKey)) { alert('planKey must be one of: ' + allowed.join(', ')); return; }
      if (!plan.name) { alert('name is required'); return; }
      if (!plan.hours) { alert('hours is required'); return; }
      if (isNaN(plan.price) || plan.price < 0) { alert('price must be a non-negative number'); return; }
      if (isNaN(plan.setupFee) || plan.setupFee < 0) { alert('setupFee must be a non-negative number'); return; }
      const res = await fetch(`${base}/api/admin/pricing`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeader() },
        body: JSON.stringify({ lang, plan })
      });
      if (!res.ok) { alert('Add failed: ' + res.status); return; }
      document.getElementById('new_planKey').value = '';
      document.getElementById('new_name').value = '';
      document.getElementById('new_hours').value = '';
      document.getElementById('new_price').value = '';
      document.getElementById('new_setupFee').value = '';
      document.getElementById('new_badge').value = '';
      document.getElementById('new_features').value = '';
      document.getElementById('new_highlighted').checked = false;
      await load();
    }

    document.getElementById('load').onclick = load;
    document.getElementById('add').onclick = add;

    // Prefill token from localStorage and persist on change
    (function initToken() {
      try {
        const stored = localStorage.getItem('adminToken');
        if (stored) {
          document.getElementById('token').value = stored;
        }
      } catch (_) { }
    })();

    document.getElementById('token').addEventListener('input', (e) => {
      try {
        localStorage.setItem('adminToken', e.target.value.trim());
      } catch (_) { }
    });

    // Auto-load if a token is present.
    window.addEventListener('DOMContentLoaded', () => {
      const tokenVal = document.getElementById('token').value.trim();
      if (tokenVal) {
        load();
      }
    });
  </script>
</body>

</html>
