<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FACC15;stop-opacity:1">
        <animate attributeName="stop-color" values="#FACC15;#F59E0B;#FACC15" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1">
        <animate attributeName="stop-color" values="#F59E0B;#FACC15;#F59E0B" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#grad1)">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="8s" repeatCount="indefinite" />
  </rect>
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    D
  </text>
</svg>

