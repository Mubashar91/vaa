<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1">
        <animate attributeName="stop-color" values="#EF4444;#F97316;#EF4444" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1">
        <animate attributeName="stop-color" values="#F97316;#EF4444;#F97316" dur="2s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#grad1)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    <animate attributeName="font-size" values="16;18;16" dur="1.5s" repeatCount="indefinite" />
    A
  </text>
</svg>
