name: Deploy Backend to VPS

on:
  push:
    branches:
      - mubii
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "🚀 Starting deployment..."

            REPO_DIR="/var/www/vaa-backend"
            BACKEND_DIR="$REPO_DIR/backend"
            ENV_FILE="$BACKEND_DIR/.env"
            TEMP_ENV_BACKUP="/tmp/vaa-backend.env.backup"

            echo "📂 Navigating to repo..."
            cd $REPO_DIR

            # Backup existing .env
            if [ -f "$ENV_FILE" ]; then
              echo "💾 Backing up .env..."
              cp "$ENV_FILE" "$TEMP_ENV_BACKUP"
            fi

            echo "📥 Fetching latest code..."
            git fetch origin mubii
            git reset --hard origin/mubii

            # Restore or create .env
            if [ -f "$TEMP_ENV_BACKUP" ]; then
              echo "♻️ Restoring .env..."
              mv "$TEMP_ENV_BACKUP" "$ENV_FILE"
            else
              echo "🆕 Creating new .env..."

              echo "PORT=5001" > "$ENV_FILE"
              echo "NODE_ENV=production" >> "$ENV_FILE"
              echo "MONGO_URI=$MONGO_URI" >> "$ENV_FILE"
              echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$ENV_FILE"
              echo "JWT_SECRET=$JWT_SECRET" >> "$ENV_FILE"
              echo "CORS_ORIGIN=$CORS_ORIGIN" >> "$ENV_FILE"
            fi

            echo "📦 Installing dependencies..."
            cd $BACKEND_DIR
            npm ci --omit=dev

            echo "🔄 Restarting PM2..."

            pm2 stop vaa-backend || true
            pm2 delete vaa-backend || true

            pm2 start ecosystem.config.cjs
            pm2 save

            echo "⏳ Waiting for app to boot..."
            sleep 10

            echo "🏥 Running health check..."

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/health || echo "000")

            echo "Health status: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "✅ Deployment successful!"
              pm2 list
            else
              echo "❌ Deployment failed!"
              pm2 logs vaa-backend --lines 50
              exit 1
            fi

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment failed"
          fi
